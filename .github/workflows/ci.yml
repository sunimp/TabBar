name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and Demo (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 26.6：验证 iPhone Duo 代码（#if compiler(>=6.4)）被排除后，旧工具链仍可编译。
          - runner: macos-26
            xcode: "26.6"
          # 27.1：唯一编译 iPhone Duo 代码的工具链；xcode-27 镜像目前为 preview。
          - runner: xcode-27
            xcode: "27.1"
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 检查工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: 运行 iOS Simulator 测试
        run: |
          DESTINATION_ID="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = [device for runtime in json.load(sys.stdin)["devices"].values() for device in runtime]; phones = [device for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; print(phones[0]["udid"])')"
          xcodebuild test \
            -scheme TabBar \
            -destination "platform=iOS Simulator,id=${DESTINATION_ID}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: 构建 Demo
        run: |
          xcodebuild build \
            -project Demo/TabBarDemo.xcodeproj \
            -scheme TabBarDemo \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
